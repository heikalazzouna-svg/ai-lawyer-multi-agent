[project]
name = "ai-lawyer"
version = "1.0.0"
description = "AI Lawyer - Retrieval-Augmented Generation with LLM reasoning for legal documents"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.43",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-groq>=0.2",
    "langchain-huggingface>=0.1",
    "faiss-cpu>=1.10",
    "pdfplumber>=0.11",
    "sentence-transformers>=3.4",
    "python-dotenv>=1.0",
    "reportlab>=4.3",
    "python-docx>=1.1.0",
    "pgvector>=0.2.5",
    "redis>=5.0.0",
    "psycopg2-binary>=2.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "langgraph>=0.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.setuptools]
py-modules = ["frontend", "rag_pipeline", "vector_database", "report_service", "api_server"]

[tool.setuptools.packages.find]
include = ["api*", "agents*"]
exclude = ["web*", "pdfs*", "vectorstore*"]
